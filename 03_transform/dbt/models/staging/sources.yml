version: 2

sources:
  - name: raw
    tables:
      - name: yellow_tripdata
        description: >
          Raw NYC yellow taxi trip records for January 2024, read
          directly from the NYC TLC's public HTTPS parquet host —
          no download or load step required.
        meta:
          # dbt-duckdb's "external_location" tells the source where the
          # actual file lives. It accepts a plain file path, and DuckDB's
          # httpfs/parquet extensions let that same key point at a URL or
          # S3 path instead — dbt builds a view over it either way:
          #
          #   local file:   external_location: "data/yellow_tripdata.parquet"
          #   remote HTTPS: external_location: "https://.../yellow_tripdata_2024-01.parquet"
          #   S3 bucket:    external_location: "s3://my-bucket/yellow_tripdata.parquet"
          #
          # We're using the remote HTTPS form here so nobody has to
          # download the file first — dbt-duckdb streams it on demand.
          # A literal URL is used (rather than the {name} pattern)
          # because TLC's real filenames use a hyphen in the date
          # (yellow_tripdata_2024-01.parquet), which isn't valid in a
          # dbt/SQL identifier — so the table name and the file name
          # can't just be the same string.
          #
          # Covering a RANGE of months/years instead of one file works
          # differently depending on where the files live:
          #
          #   local file or S3 (both support directory listing, so glob
          #   wildcards work):
          #     external_location: "data/yellow_tripdata_2024-*.parquet"          # all of 2024
          #     external_location: "data/yellow_tripdata_202[34]-*.parquet"       # 2023 and 2024
          #     external_location: "data/yellow_tripdata_2024-{01,02,03}.parquet" # Jan-Mar 2024
          #     external_location: "s3://my-bucket/yellow_tripdata_2024-*.parquet"
          #
          #   remote HTTPS (a plain web server has no directory listing,
          #   so wildcards don't work here): pass an explicit list of
          #   URLs to DuckDB's read_parquet() instead, one per file —
          #   mix years/months freely since each URL is spelled out:
          #     external_location: >
          #       read_parquet([
          #         'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet',
          #         'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-02.parquet',
          #         'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2023-12.parquet'
          #       ])
          external_location: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet"

